services:
  nginx:
    image: nginx:latest
    ports:
      - "49003:80"
    volumes:
      - .:/var/www/api.aftaa.ru
      - ./docker/nginx/hosts:/etc/nginx/conf.d
      - ./docker/nginx/logs:/var/log/nginx
    restart: always
    links:
      - php

  php:
    build: docker/php
    volumes:
      - .:/var/www/api.aftaa.ru
    restart: always
    links:
      - mysql

  mysql:
    image: mysql:9.7.4
    ports:
      - "49004:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    restart: always
